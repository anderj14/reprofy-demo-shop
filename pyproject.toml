[project]
name = "reprofy-demo-shop"
version = "0.1.0"
description = "Synthetic storefront for demonstrating Reprofy bug intake and reviewed fixes."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
